name: Preparar branch Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          HUSKY: 0

      - name: Gerar Prisma Client
        run: npm run db:generate
        env:
          DATABASE_PROVIDER: postgresql

      - name: Compilar Evolution API
        run: npm run build

      - name: Preparar deploy leve
        run: |
          rm -rf /tmp/evolution-deploy
          mkdir -p /tmp/evolution-deploy

          # Aplicacao compilada
          cp dist/main.js /tmp/evolution-deploy/index.js

          # Arquivos necessarios para instalar e executar
          cp package.json /tmp/evolution-deploy/package.json
          cp package-lock.json /tmp/evolution-deploy/package-lock.json
          cp runWithProvider.js /tmp/evolution-deploy/runWithProvider.js

          # Prisma
          cp -r prisma /tmp/evolution-deploy/prisma

          # Arquivos publicos
          if [ -d "public" ]; then
            cp -r public /tmp/evolution-deploy/public
          fi

                 # Evolution Manager
          echo "Compactando Evolution Manager..."
          tar -czf /tmp/evolution-deploy/manager.tar.gz -C manager dist

          echo "===== MANAGER COMPACTADO ====="
          ls -lh /tmp/evolution-deploy/manager.tar.gz

          # Node 24
          echo "24" > /tmp/evolution-deploy/.nvmrc

          # Node 24
          echo "24" > /tmp/evolution-deploy/.nvmrc

          echo "===== CONTEUDO DO DEPLOY ====="
          ls -lah /tmp/evolution-deploy

          echo "===== TAMANHO ====="
          du -sh /tmp/evolution-deploy

      - name: Criar branch deploy
        run: |
          cd /tmp/evolution-deploy

          git init
          git checkout -b deploy

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "deploy: versao leve sem node_modules"

          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push --force origin deploy
